name: National Evidence Link Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0,3"

permissions:
  contents: write

concurrency:
  group: national-evidence-link-monitor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, windows, iran-crawler]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl and monitor evidence links
        shell: cmd
        run: npm run monitor:links

      - name: Inspect crawl changes
        id: crawl
        shell: cmd
        run: node scripts/inspect-crawl-report.mjs

      - name: Commit meaningful crawl changes
        if: steps.crawl.outputs.meaningful == 'true'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/site-health.json data/generated/change-report.json
          git diff --cached --quiet || git commit -m "chore(crawl): update evidence health (changed=${{ steps.crawl.outputs.changed }}, new=${{ steps.crawl.outputs.new }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: No meaningful changes
        if: steps.crawl.outputs.meaningful != 'true'
        shell: cmd
        run: |
          echo No meaningful evidence changes detected.
          echo Network failures: ${{ steps.crawl.outputs.failed }}
          echo Nothing will be committed.

      - name: Upload crawl report
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: national-evidence-health
          path: |
            data/generated/site-health.json
            data/generated/change-report.json
          retention-days: 30
