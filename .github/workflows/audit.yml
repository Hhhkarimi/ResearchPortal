name: National Research Discovery & Evidence Monitor v14

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0,3"

permissions:
  contents: write

concurrency:
  group: national-research-discovery
  cancel-in-progress: false

jobs:
  audit:
    name: audit
    runs-on:
      - self-hosted
      - windows
      - iran-crawler
      - hk-crawler

    timeout-minutes: 360

    env:
      CRAWL_MAX_DEPTH: "8"
      CRAWL_MAX_PAGES_PER_UNIVERSITY: "200"
      CRAWL_MAX_PAGES_PER_HUB: "60"
      CRAWL_MAX_RESEARCH_HUBS: "24"
      CRAWL_MAX_DOCUMENTS_PER_UNIVERSITY: "250"

      CRAWL_PAGE_TIMEOUT_MS: "15000"
      CRAWL_DOCUMENT_TIMEOUT_MS: "20000"
      CRAWL_BROWSER_TIMEOUT_MS: "45000"

      CRAWL_BROWSER_CLICK_BUDGET: "6"
      CRAWL_BROWSER_CLICK_WAIT_MS: "900"
      CRAWL_BROWSER_ACTION_LOG_LIMIT: "240"

      CRAWL_PAGE_CONCURRENCY: "3"
      CRAWL_UNIVERSITY_CONCURRENCY: "3"
      CRAWL_USE_BROWSER_FALLBACK: "1"

      CRAWL_CHECKPOINT_INTERVAL_MS: "1800000"
      CRAWL_CHECKPOINT_DIR: "data/crawl-checkpoints"
      CRAWL_CHECKPOINT_PUSH: "1"
      CRAWL_CHECKPOINT_RESET: "0"

      DISCOVERY_PROMOTE_CONFIDENCE: "0.78"

      PIPELINE_ARTIFACT_ROOT: "C:\\actions-runner\\_pipeline-artifacts"
      PIPELINE_WORK_ROOT: "C:\\actions-runner\\_pipeline-work"

    defaults:
      run:
        shell: cmd

    steps:

      # ============================================================
      # STEP 1
      # Absolutely minimal.
      # If this appears, GitHub successfully created the timeline.
      # ============================================================
      - name: "01 - Runner started"
        run: |
          @echo off
          echo ============================================================
          echo RUNNER STARTED
          echo ============================================================
          echo Computer: %COMPUTERNAME%
          echo User: %USERNAME%
          echo Workspace: %GITHUB_WORKSPACE%
          echo Repository: %GITHUB_REPOSITORY%
          echo SHA: %GITHUB_SHA%
          echo ============================================================

      # ============================================================
      # STEP 2
      # Prepare local repository without actions/checkout.
      # ============================================================
      - name: "02 - Prepare repository"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1

          git --version || exit /b 1
          git config --global --add safe.directory "%GITHUB_WORKSPACE%" || exit /b 1

          if not exist ".git" goto clone_repository

          echo Existing repository found.

          git remote get-url origin >nul 2>&1
          if errorlevel 1 git remote add origin https://github.com/%GITHUB_REPOSITORY%.git

          git remote set-url origin https://github.com/%GITHUB_REPOSITORY%.git || exit /b 1

          git fetch --force --prune origin main || exit /b 1

          git reset --hard origin/main || exit /b 1
          git clean -ffdx || exit /b 1
          git checkout -B main origin/main || exit /b 1

          goto repository_ready

          :clone_repository

          echo Repository does not exist. Cloning...

          git clone --branch main --single-branch https://github.com/%GITHUB_REPOSITORY%.git . || exit /b 1

          :repository_ready

          git remote set-url --push origin https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git || exit /b 1

          echo.
          echo Repository:
          git log -1 --oneline || exit /b 1

          echo.
          git status --short --branch || exit /b 1

          echo.
          echo REPOSITORY READY

      # ============================================================
      # STEP 3
      # Runtime verification.
      # ============================================================
      - name: "03 - Verify Node"
        run: |
          @echo off

          where node || exit /b 1

          node --version || exit /b 1

          node -e "const m=Number(process.versions.node.split('.')[0]); console.log('Node major='+m); if(m<22) process.exit(1)" || exit /b 1

          where npm.cmd || exit /b 1

          npm.cmd --version || exit /b 1

          echo NODE OK

      - name: "04 - Verify Python"
        run: |
          @echo off

          where py >nul 2>&1
          if errorlevel 1 goto python_direct

          py -3 -c "import sys; print(sys.version); assert sys.version_info >= (3,11)" || exit /b 1

          goto python_done

          :python_direct

          where python || exit /b 1

          python -c "import sys; print(sys.version); assert sys.version_info >= (3,11)" || exit /b 1

          :python_done

          echo PYTHON OK

      # ============================================================
      # STEP 5
      # Snapshot date.
      # ============================================================
      - name: "05 - Set snapshot date"
        run: |
          @echo off

          node -e "const fs=require('fs'); const d=new Date().toISOString().slice(0,10); fs.appendFileSync(process.env.GITHUB_ENV,'PIPELINE_SNAPSHOT_DATE='+d+'\n'); console.log('PIPELINE_SNAPSHOT_DATE='+d)" || exit /b 1

      # ============================================================
      # STEP 6
      # Transform validation.
      # ============================================================
      - name: "06 - Test crawler v14 transform"
        run: |
          @echo off

          echo ============================================================
          echo TESTING CRAWLER V14 TRANSFORM
          echo ============================================================

          node scripts/test-crawler-v14.mjs || exit /b 1

          echo.
          echo CRAWLER TRANSFORM OK

      # ============================================================
      # STEP 7
      # Clean leftovers.
      # ============================================================
      - name: "07 - Clean old crawler runtime"
        run: |
          @echo off

          if exist "scripts\.deep-crawl-research-v14-runtime.mjs" del /f /q "scripts\.deep-crawl-research-v14-runtime.mjs"

          if exist "C:\actions-runner\_research-documents" rmdir /s /q "C:\actions-runner\_research-documents"

          echo CLEANUP OK

      # ============================================================
      # STEP 8
      # Sanitize existing data.
      # ============================================================
      - name: "08 - Prepare current data"
        run: npm.cmd run prepare:data

      - name: "09 - Validate current data"
        run: npm.cmd run validate:data

      - name: "10 - Validate no social evidence"
        run: npm.cmd run validate:no-social

      # ============================================================
      # STEP 11
      # Baseline commit.
      # ============================================================
      - name: "11 - Commit sanitized baseline"
        run: |
          @echo off

          git config user.name "github-actions[bot]" || exit /b 1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || exit /b 1

          git add data public/datasets || exit /b 1

          git diff --cached --quiet
          if not errorlevel 1 goto baseline_no_changes

          echo Creating sanitized baseline commit...

          git commit -m "chore(data): sanitize published evidence" || exit /b 1

          :baseline_no_changes

          echo Baseline staging complete.

      - name: "12 - Sync sanitized baseline"
        run: |
          @echo off

          git pull --rebase origin main || exit /b 1
          git push origin HEAD:main || exit /b 1

          echo BASELINE SYNCED

      # ============================================================
      # STEP 13
      # Main crawler.
      # ============================================================
      - name: "13 - Run deep crawler v14"
        timeout-minutes: 330
        run: |
          @echo off

          echo ============================================================
          echo DEEP CRAWLER V14
          echo ============================================================

          echo Snapshot: %PIPELINE_SNAPSHOT_DATE%
          echo Max depth: %CRAWL_MAX_DEPTH%
          echo Universities concurrency: %CRAWL_UNIVERSITY_CONCURRENCY%
          echo Pages concurrency: %CRAWL_PAGE_CONCURRENCY%
          echo.

          node scripts/deep-crawl-research-v14.mjs || exit /b 1

          echo.
          echo DEEP CRAWLER COMPLETE

      # ============================================================
      # STEP 14
      # Raw output validation.
      # ============================================================
      - name: "14 - Validate crawler outputs"
        run: node scripts/validate-crawler-v14.mjs

      # ============================================================
      # STEP 15
      # Promote discovery.
      # ============================================================
      - name: "15 - Promote discovery"
        run: npm.cmd run prepare:data

      # ============================================================
      # STEP 16
      # Dataset validations.
      # ============================================================
      - name: "16 - Validate promoted data"
        run: npm.cmd run validate:data

      - name: "17 - Validate entities"
        run: npm.cmd run validate:entities

      - name: "18 - Validate promoted no-social"
        run: npm.cmd run validate:no-social

      # ============================================================
      # STEP 19
      # Link monitor.
      # ============================================================
      - name: "19 - Monitor evidence links"
        run: npm.cmd run monitor:links

      # ============================================================
      # STEP 20
      # Remove completed checkpoints only after success.
      # ============================================================
      - name: "20 - Remove completed checkpoints"
        run: |
          @echo off

          if exist "data\crawl-checkpoints" (
            rmdir /s /q "data\crawl-checkpoints" || exit /b 1
          )

          echo CHECKPOINTS CLEANED

      # ============================================================
      # STEP 21
      # Final result commit.
      # ============================================================
      - name: "21 - Commit crawler results"
        run: |
          @echo off

          git config user.name "github-actions[bot]" || exit /b 1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || exit /b 1

          git add -A data public/datasets || exit /b 1

          git diff --cached --quiet
          if not errorlevel 1 goto final_no_changes

          git commit -m "chore(crawl): publish v14 research evidence" || exit /b 1

          :final_no_changes

          echo FINAL DATA READY

      - name: "22 - Push crawler results"
        run: |
          @echo off

          git pull --rebase origin main || exit /b 1
          git push origin HEAD:main || exit /b 1

          echo FINAL RESULTS PUSHED

      # ============================================================
      # STEP 23
      # Completion marker.
      # ============================================================
      - name: "23 - Pipeline complete"
        run: |
          @echo off

          echo ============================================================
          echo RESEARCH PIPELINE V14 COMPLETED
          echo ============================================================
