name: National Research Discovery & Evidence Monitor v14

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0,3"

permissions:
  contents: write

concurrency:
  group: national-research-discovery
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, windows, iran-crawler]
    timeout-minutes: 360

    env:
      CRAWL_MAX_DEPTH: "8"
      CRAWL_MAX_PAGES_PER_UNIVERSITY: "200"
      CRAWL_MAX_PAGES_PER_HUB: "60"
      CRAWL_MAX_RESEARCH_HUBS: "24"
      CRAWL_MAX_DOCUMENTS_PER_UNIVERSITY: "250"
      CRAWL_PAGE_TIMEOUT_MS: "15000"
      CRAWL_DOCUMENT_TIMEOUT_MS: "20000"
      CRAWL_BROWSER_TIMEOUT_MS: "45000"
      CRAWL_BROWSER_CLICK_BUDGET: "6"
      CRAWL_BROWSER_CLICK_WAIT_MS: "900"
      CRAWL_BROWSER_ACTION_LOG_LIMIT: "240"
      CRAWL_PAGE_CONCURRENCY: "3"
      CRAWL_UNIVERSITY_CONCURRENCY: "3"
      CRAWL_USE_BROWSER_FALLBACK: "1"
      CRAWL_CHECKPOINT_INTERVAL_MS: "1800000"
      CRAWL_CHECKPOINT_DIR: "data/crawl-checkpoints"
      CRAWL_CHECKPOINT_PUSH: "1"
      CRAWL_CHECKPOINT_RESET: "0"
      DISCOVERY_PROMOTE_CONFIDENCE: "0.78"
      PIPELINE_ARTIFACT_ROOT: "C:\\actions-runner\\_pipeline-artifacts"
      PIPELINE_WORK_ROOT: "C:\\actions-runner\\_pipeline-work"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Verify preinstalled Node runtime
        shell: powershell
        run: |
          $node = Get-Command node -ErrorAction SilentlyContinue

          if (-not $node) {
            $candidates = @(
              "$env:ProgramFiles\nodejs\node.exe",
              "${env:ProgramFiles(x86)}\nodejs\node.exe",
              "$env:LOCALAPPDATA\Programs\nodejs\node.exe"
            ) | Where-Object { $_ -and (Test-Path $_) }

            if ($candidates.Count -eq 0) {
              throw "Node.js was not found on the self-hosted runner. Install Node 22+ system-wide or add it to PATH."
            }

            $nodeDir = Split-Path $candidates[0] -Parent
            $env:PATH = "$nodeDir;$env:PATH"
            $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $version = (& node --version).Trim()
          $major = [int](($version -replace '^v','').Split('.')[0])

          if ($major -lt 22) {
            throw "Node.js 22+ is required. Found $version"
          }

          Write-Host "Using local Node: $version"
          Write-Host "npm: $(& npm.cmd --version)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set UTC snapshot date
        shell: powershell
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          "PIPELINE_SNAPSHOT_DATE=$date" >> $env:GITHUB_ENV

      - name: Verify v14 crawler source transformation
        shell: cmd
        run: node scripts/test-crawler-v14.mjs

      - name: Clean legacy downloaded document archive
        shell: cmd
        run: |
          @echo off
          if exist "C:\actions-runner\_research-documents" (
            rmdir /s /q "C:\actions-runner\_research-documents"
          )
          if exist "scripts\.deep-crawl-research-v14-runtime.mjs" (
            del /q "scripts\.deep-crawl-research-v14-runtime.mjs"
          )

      - name: Sanitize and validate current published evidence
        shell: cmd
        run: |
          npm run prepare:data
          npm run validate:data
          npm run validate:no-social

      - name: Publish sanitized baseline
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/datasets
          git diff --cached --quiet || git commit -m "chore(data): sanitize published evidence"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deep crawl official research portals v14 with checkpoint resume
        shell: cmd
        run: node scripts/deep-crawl-research-v14.mjs

      - name: Validate raw v14 discovery outputs
        shell: cmd
        run: node scripts/validate-crawler-v14.mjs

      - name: Promote discovery, clean entities and rebuild evidence
        shell: cmd
        run: npm run prepare:data

      - name: Validate promoted datasets
        shell: cmd
        run: |
          npm run validate:data
          npm run validate:entities
          npm run validate:no-social

      - name: Monitor published evidence links
        shell: cmd
        run: npm run monitor:links

      - name: Remove completed crawl checkpoints
        shell: cmd
        run: |
          @echo off
          if exist "data\crawl-checkpoints" (
            rmdir /s /q "data\crawl-checkpoints"
          )

      - name: Commit completed v14 crawl results
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data public/datasets
          git diff --cached --quiet || git commit -m "chore(crawl): publish v14 research evidence"
          git pull --rebase origin main
          git push origin HEAD:main
